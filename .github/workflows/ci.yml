name: Knowledge City foundation
on:
  push:
    branches: [websiteWorkandTest]
  pull_request:
permissions:
  contents: read
jobs:
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - run: npm run check
      - run: npm test
      - run: npm run test:integration
      - run: git diff --check
